name: vortex-gateway
services:
  gateway:
    build: .     
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - REDIS_HOST=redis     
    depends_on:
      - redis
    restart: unless-stopped

  redis:
    image: redis:7-alpine  
    ports:
      - "6379:6379"           
    restart: unless-stopped